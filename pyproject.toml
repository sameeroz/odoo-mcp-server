[project]
name = "odoo-mcp-server"
version = "0.2.0"
description = "MCP Server for Odoo"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sameer Anwar", email = "gdrboy11@gmail.com" }
]
license = { text = "MIT" }
keywords = ["mcp", "mcp-client", "odoo", "model-context-protocol", "openai", "odoo-mcp", "odoo-mcp-server"]
dependencies = [
    "mcp[cli]>=1.13.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
odoo-mcp-server = "mcpserver.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
